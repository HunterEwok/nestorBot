# Local development databases, same major version as production (postgres:18 on the router).
#   docker compose up -d
services:
  db:          # for running the collector locally
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata18:/var/lib/postgresql]   # postgres 18 images keep data under /var/lib/postgresql/18

  db-test:     # throwaway cluster for pytest; data lives in memory
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    tmpfs: [/var/lib/postgresql]

volumes:
  pgdata18:
