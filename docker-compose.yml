# Local development databases. Not used on the Pi.
#   docker compose up -d
services:
  db:          # for running the collector locally
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  db-test:     # throwaway cluster for pytest; data lives in memory
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    tmpfs: [/var/lib/postgresql/data]

volumes:
  pgdata:
