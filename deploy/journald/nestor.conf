# /etc/systemd/journald.conf.d/nestor.conf on the Pi (system on microSD).
# The collector writes nothing to disk except its log; keep the journal small
# and flushed rarely to spare the card. Logs never contain message text.
[Journal]
SystemMaxUse=100M
# Until the journal is flushed to the card (or if it is never persistent), it lives in RAM: cap it too.
RuntimeMaxUse=50M
MaxRetentionSec=14day
SyncIntervalSec=15m
