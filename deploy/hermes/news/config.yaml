# Hermes profile `news`, the profile without tools: ~/.hermes/profiles/news/config.yaml
# (hermes profile create news, then copy this file and news/SOUL.md into it).
#
# It sorts the news digest's items (titles and teasers from the sources in nestor/news/sources.py:
# one line in Russian per item, a section, a verdict). By default (nestor/bot/routing.py) it also
# gets short numbered chat excerpts without names: for reactions, for the /address checks (is a
# message to the bot, yes or no) and for the bot's rare /chime remarks, which go to the group.
# It needs no tools at all: no archive, no internet, so a prompt injection in a feed or in the
# chat has nothing to use. Without this profile the collector uses `web` for the news (its search
# tools then add some tokens to every call); reactions are picked by code, and there are no
# address checks and no remarks.
# Verify after every Hermes update (deploy/hermes/README.md, "Проверка").

model:
  provider: anthropic            # ANTHROPIC_API_KEY in ~/.hermes/profiles/news/.env (may be the same key)
  default: claude-haiku-5-5      # cheap: dozens of items a day

platform_toolsets:
  api_server: []                 # no tools at all

agent:
  disabled_toolsets:             # second line of defence; names per the Toolsets Reference of your Hermes version
    - terminal
    - file
    - browser
    - web
    - code_execution
    - delegation
    - memory
    - skills
    - cronjob
    - messaging

gateway:
  api_server:
    enabled: true
    # key: set API_SERVER_KEY in ~/.hermes/profiles/news/.env; the same value goes to
    # HERMES_NEWS_API_KEY in /opt/nestor/.env

# No mcp_servers: the archive is out of reach by construction.
