# PostgreSQL 16 on the database host (data on SSD), not on the Pi.
# Drop into /etc/postgresql/16/main/conf.d/nestor.conf and adjust the marked lines.

# Listen only where the Pi can reach: the VPN interface address (recommended),
# or the public address if TLS is the only protection. Never '*' without a firewall.
listen_addresses = 'localhost,100.64.0.1'      # <-- your VPN address

ssl = on                                        # required when not on a VPN
password_encryption = scram-sha-256

max_connections = 20
default_text_search_config = 'pg_catalog.russian'
timezone = 'UTC'
log_timezone = 'UTC'
# Statements are not logged, so message text never reaches the server log.
log_statement = 'none'
log_min_duration_statement = -1
# Memory: shared_buffers ~25% of the host's RAM, e.g. 1GB on an 4 GB host.
#shared_buffers = 1GB
