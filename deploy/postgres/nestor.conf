# Drop into /etc/postgresql/16/main/conf.d/ (Raspberry Pi 4, 8 GB, data on USB 3 SSD).
listen_addresses = 'localhost'
shared_buffers = 1GB
effective_cache_size = 2GB
work_mem = 16MB
maintenance_work_mem = 128MB
wal_compression = on
max_connections = 20
default_text_search_config = 'pg_catalog.russian'
timezone = 'UTC'
log_timezone = 'UTC'
# Statements are not logged, so message text never reaches the server log.
log_statement = 'none'
log_min_duration_statement = -1
