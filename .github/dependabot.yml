# Dependabot: weekly check of Python dependencies from pyproject.toml.
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Not covered on purpose:
#   - docker-compose.yml uses the floating tag postgres:18, so the only possible
#     update is a new major version, and production stays on 18 (the router).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    groups:
      # Minor and patch bumps arrive together as one PR; a major bump gets its own PR.
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"


  # The pinned actions of .github/workflows (claude-review.yml); the SHA and the version comment move together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Moscow"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
