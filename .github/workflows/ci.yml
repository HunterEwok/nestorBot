# The checks main's ruleset waits for: build, lint and test. A check is named after its job, so renaming a job
# means changing the ruleset too. The same checks run locally: pip install -e ".[dev]", ruff check ., pytest.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The package installs as on the Pi (pip install -e .), its dependencies agree and every module but the
    # history importer imports; then with the importer's extra as on the Mac, and the importer imports too. On the
    # lowest Python the package supports and on the Pi's.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.11
            3.13
      - name: Install and import on Python 3.11 and 3.13
        run: |
          for v in 3.11 3.13; do
            echo "::group::Python $v"
            python$v -m venv "$RUNNER_TEMP/venv$v"
            py="$RUNNER_TEMP/venv$v/bin/python"
            "$py" -m pip install --quiet --upgrade pip
            "$py" -m pip install --quiet -e .
            "$py" -m pip check
            "$py" .github/import_all.py nestor.importer
            "$py" -m pip install --quiet -e ".[import]"
            "$py" -m pip check
            "$py" .github/import_all.py
            echo "::endgroup::"
          done

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet -e ".[dev]"     # ruff, at the version pyproject.toml pins
      - run: ruff check --output-format=github .           # the rules are in pyproject.toml, [tool.ruff.lint]

  test:
    # All tests, on PostgreSQL 18 as on the router and on the Pi's Python. The database is a throwaway one:
    # the tests drop and recreate their roles and databases.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      NESTOR_TEST_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5433/postgres
    steps:
      - uses: actions/checkout@v5
      - name: pg_dump and pg_restore 18 for the backup tests
        # Without them those tests are skipped: the runner's own client is older than the server.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet -e ".[dev]"
      - run: pytest -q -rs          # -rs: why anything was skipped
