[build-system]
# 77+ understands the SPDX `license` string below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nestor"
version = "0.1.0"
description = "Telegram group archive bot with Hermes Agent integration"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "aiogram>=3.13,<4",
    "pydantic>=2.11",  # model_dump(fallback=...) in collector.app.dump
    "asyncpg>=0.29",
    "python-dotenv>=1.0",
    "mcp>=2.3,<3",
    # News digest: RSS/Atom feeds and two HTML pages (Telegram channel previews, Reggaeville).
    "feedparser>=6.0.11,<7",
    "beautifulsoup4>=4.12,<5",
    "idna>=3.7",  # IDNA 2008 for look-alike hosts in link hints (nestor.bot.markup)
]

[project.optional-dependencies]
# History import runs on the owner's laptop, not on the Pi.
import = ["telethon>=1.36"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "telethon>=1.36", "ruff>=0.16.10,<0.17"]

[tool.setuptools.packages.find]
include = ["nestor*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pyflakes and pycodestyle's errors, ruff's classic set. Named here so that a newer ruff or a user's own ruff
# config does not change what CI checks (.github/workflows/ci.yml, the lint job).
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
